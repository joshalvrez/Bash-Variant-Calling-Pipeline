# CI: the checks every change gets, on GitHub's machine, before it joins main.
#
# Two jobs, the cheap one first. `lint` reads the scripts and needs nothing else;
# `smoke` builds the image and runs the whole pipeline on the smoke dataset, and
# starts only when `lint` has passed.
name: CI

# on --> the events that start a run: a push to main, and every pull request; check that runs only after the merge tells you about a problem you have already merged.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: ShellCheck every script of the bash pipeline
        # an error fails the job, not the whole workflow, so that the smoke job can still run if the scripts are broken.
        run: |
          shellcheck --version | sed -n 2p
          shellcheck --severity=error run_pipeline.sh run_sample.sh lib/*.sh stages/*.sh aws/batch_run.sh
  
  # smoke: run the whole pipeline on the smoke dataset, inside the image built from containers/Dockerfile
  smoke:
    # needs: lint --> the smoke job starts only after the lint job has passed, so that we don't waste time building the image if the scripts are broken.
    needs: lint
    runs-on: ubuntu-latest
    # in week 3, we ran the pipeline using appainter exec <image> which had all the tools we would need. here, CI does the same thing but using Docker images 
    # CI creates a fresh machine for each job, so we need to build the image from containers/Dockerfile every time.
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1

      - name: Build the image from containers/Dockerfile
        run: docker build -t variant-call:ci containers/

      - name: Run the pipeline on the smoke dataset, inside the image
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp \
            -v "$PWD":/repo -w /repo/tests/smoke \
            -e REF=/repo/tests/smoke/smoke.fa -e REGION=smoke_1mb -e THREADS=4 \
            variant-call:ci bash /repo/run_pipeline.sh samplesheet.csv /repo/ci-out

      - name: Check the manifest against the course's contract
        run: python3 tools/check_manifest.py ci-out/results/manifest.json --results-dir ci-out/results

      - name: The manifest names the commit that was tested
        run: |
          recorded=$(python3 -c 'import json; print(json.load(open("ci-out/results/manifest.json"))["pipeline"]["git_sha"])')
          echo "manifest: ${recorded}"
          echo "tested:   ${GITHUB_SHA}"
          [ "${recorded}" = "${GITHUB_SHA}" ]

      - name: Compare the variant records with aws-run/, made by the same image
        run: |
          records() {
            docker run --rm --user "$(id -u):$(id -g)" -v "$PWD":/repo -w /repo variant-call:ci \
              bash -c "bcftools view -H $1 | sha256sum | cut -d' ' -f1"
          }
          expected=$(records aws-run/cohort.filtered.vcf.gz)
          got=$(records ci-out/results/cohort.filtered.vcf.gz)
          echo "aws-run/:  ${expected}"
          echo "this run:  ${got}"
          [ "${got}" = "${expected}" ]
